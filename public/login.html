<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inicio de sesion | Delirium Decor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="login">
  <header class="site-header">
    <a class="brand" href="/index.html">
      <img class="brand-logo" src="/images/logo-delirium.png" alt="Logo Delirium Decor" />
      <span>Delirium Decor</span>
    </a>
    <nav class="nav-links">
      <a href="/index.html">Inicio</a>
      <a href="/catalog.html">Catalogo</a>
      <a href="/about.html">Acerca de</a>
      <a href="/contact.html">Contacto</a>
      <a href="/login" class="nav-login-icon" aria-label="Iniciar sesion de administrador" title="Iniciar sesion">
        <img src="/images/login-icon.svg" alt="Iniciar sesion" />
      </a>
    </nav>
  </header>

  <main>
    <section class="panel auth-panel">
      <h1>Inicio de sesion</h1>
      <p class="small">Usa tus credenciales de administrador para gestionar productos.</p>
      <form id="loginForm" class="stack-md">
        <input type="text" name="username" placeholder="Usuario" required />
        <input type="password" name="password" placeholder="Contrasena" required />
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p id="loginMessage" class="small"></p>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <script src="/script.js"></script>
</body>
</html>
