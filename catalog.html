<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogo | Delirium Decor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-page="catalog">
  <header class="site-header">
    <a class="brand" href="/index.html">
      <img class="brand-logo" src="/images/logo-delirium.png" alt="Logo Delirium Decor" />
      <span>Delirium Decor</span>
    </a>
    <nav class="nav-links">
      <a href="/index.html">Inicio</a>
      <a href="/catalog.html">Catalogo</a>
      <a href="/about.html">Acerca de</a>
      <a href="/contact.html">Contacto</a>
      <a href="/login" class="nav-login-icon" aria-label="Iniciar sesion de administrador" title="Iniciar sesion">
        <img src="/images/login-icon.svg" alt="Iniciar sesion" />
      </a>
    </nav>
  </header>

  <main>
    <section class="panel spacing-lg">
      <h1>Catalogo</h1>
      <p class="small">Explora mugs, tazas y detalles decorativos para tu hogar.</p>
      <div class="filters">
        <input id="searchInput" type="search" placeholder="Buscar productos..." />
        <select id="categorySelect">
          <option value="all">Todas las categorias</option>
          <option value="mugs">Mugs</option>
          <option value="cups">Tazas</option>
          <option value="decor">Decoracion</option>
        </select>
      </div>
    </section>

    <div id="loadingState" class="loading-state hidden">
      <span class="spinner"></span>
      <span>Cargando productos...</span>
    </div>

    <section class="product-grid" id="productGrid"></section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <script src="/script.js"></script>
</body>
</html>
